<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخطة الأسبوعية</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خطتي الأسبوعية">
<meta name="theme-color" content="#2F5D50">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232F5D50'/%3E%3Cpath d='M28 52 L43 67 L74 33' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1E2320;
    --ink-muted: #6D7167;
    --line: #E4E1D8;
    --pine: #2F5D50;
    --pine-deep: #203F37;
    --pine-tint: #E7EFEC;
    --high: #B3402A;
    --high-tint: #F6E6E1;
    --med: #B8862B;
    --med-tint: #F6EEDD;
    --low: #6F7A63;
    --low-tint: #ECEFE7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1F1C; --surface:#23271F; --ink:#EDEFE9; --ink-muted:#9AA294;
      --line:#343A31; --pine:#4E8977; --pine-deep:#6FA593; --pine-tint:#20332C;
      --high:#D98467; --high-tint:#3A241E; --med:#D7A75B; --med-tint:#382D18;
      --low:#9AA88D; --low-tint:#262C20;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1F1C; --surface:#23271F; --ink:#EDEFE9; --ink-muted:#9AA294;
    --line:#343A31; --pine:#4E8977; --pine-deep:#6FA593; --pine-tint:#20332C;
    --high:#D98467; --high-tint:#3A241E; --med:#D7A75B; --med-tint:#382D18;
    --low:#9AA88D; --low-tint:#262C20;
  }

  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px));
  }

  .wrap{ max-width:780px; margin:0 auto; }

  .login-box{
    max-width:360px; margin:60px auto; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:28px 24px; text-align:center;
  }
  .login-box h2{ font-family:'IBM Plex Sans Arabic', sans-serif; margin:0 0 6px; font-size:20px; }
  .login-box p{ color:var(--ink-muted); font-size:13px; margin:0 0 18px; }
  .login-box input{
    width:100%; padding:11px 14px; margin-bottom:10px; border-radius:10px; border:1px solid var(--line);
    font-family:'Tajawal', sans-serif; font-size:14px; background:var(--bg); color:var(--ink);
  }
  .login-actions{ display:flex; gap:8px; margin-top:6px; }
  .login-actions button{ flex:1; }
  .login-error{ color:var(--high); font-size:12.5px; min-height:16px; margin:10px 0 0; }
  .logout-btn{
    margin-inline-start:auto; border:none; background:transparent; color:inherit;
    font-size:12px; cursor:pointer; text-decoration:underline; opacity:.85;
  }
  .sync-banner{
    display:flex; align-items:center; gap:8px;
    background:var(--pine-tint); color:var(--pine-deep);
    border-radius:12px; padding:10px 14px; font-size:12.5px;
    margin-bottom:16px;
  }
  .sync-banner.warn{ background:var(--med-tint); color:var(--med); }
  .sync-dot{ width:8px; height:8px; border-radius:50%; background:currentColor; flex:0 0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:20px; margin-bottom:22px; flex-wrap:wrap;
  }
  .title-block h1{
    font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:700; font-size:28px;
    margin:0 0 4px; color:var(--pine-deep); letter-spacing:-0.3px;
  }
  .title-block p{ margin:0; color:var(--ink-muted); font-size:13px; }

  .week-ring{ display:flex; gap:6px; align-items:flex-end; }
  .ring-day{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ring-track{ width:9px; height:40px; border-radius:5px; background:var(--line); position:relative; overflow:hidden; }
  .ring-fill{ position:absolute; bottom:0; right:0; left:0; background:var(--pine); border-radius:5px; transition:height .5s ease; }
  .ring-label{ font-size:10px; color:var(--ink-muted); font-family:'IBM Plex Sans Arabic', sans-serif; }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .nav-arrows{ display:flex; align-items:center; gap:6px; }
  .nav-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .nav-btn:hover{ border-color:var(--pine); color:var(--pine); }
  .nav-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; }
  .week-range{ font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:600; font-size:15px; min-width:150px; text-align:center; }
  .nav-tools{ display:flex; align-items:center; gap:8px; }
  .today-btn{
    padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-muted); font-family:'IBM Plex Sans Arabic', sans-serif; font-size:13px; font-weight:500; cursor:pointer;
  }
  .today-btn:hover{ border-color:var(--pine); color:var(--pine); }
  .date-jump{
    padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-family:'Tajawal', sans-serif; font-size:13px; cursor:pointer;
  }

  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:22px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto; padding:9px 16px; border-radius:14px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-muted); font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:500; font-size:13px; cursor:pointer; transition:all .18s ease; text-align:center; line-height:1.5;
  }
  .tab-btn .tab-date{ display:block; font-size:16px; font-weight:700; }
  .tab-btn:hover{ border-color:var(--pine); }
  .tab-btn.active{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .tab-btn.is-today:not(.active){ border-color:var(--med); color:var(--med); }
  .tab-count{ font-size:10px; opacity:.8; display:block; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 24px 22px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:6px; }
  .panel-head h2{ font-family:'IBM Plex Sans Arabic', sans-serif; font-size:20px; margin:0; }
  .panel-progress-text{ font-size:13px; color:var(--ink-muted); }

  .bar-track{ height:6px; border-radius:4px; background:var(--line); overflow:hidden; margin-bottom:22px; }
  .bar-fill{ height:100%; background:var(--pine); border-radius:4px; transition:width .4s ease; }

  .add-row{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .add-row input[type="text"]{
    flex:1 1 200px; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    font-family:'Tajawal', sans-serif; font-size:14px; background:var(--bg); color:var(--ink);
  }
  .add-row input[type="text"]:focus{ outline:2px solid var(--pine); outline-offset:1px; }
  select#priority-select{
    padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-family:'Tajawal', sans-serif; font-size:14px; background:var(--bg); color:var(--ink);
  }
  .add-btn{
    padding:11px 20px; border-radius:10px; border:none; background:var(--pine); color:#fff;
    font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  }
  .add-btn:hover{ background:var(--pine-deep); }
  .add-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .task-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .task-item{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-radius:12px; border:1px solid var(--line); background:var(--bg); transition:opacity .2s ease;
  }
  .task-item.done{ opacity:.55; }

  .checkbox{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--ink-muted);
    flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background:var(--surface); transition:all .15s ease;
  }
  .checkbox.checked{ background:var(--pine); border-color:var(--pine); }
  .checkbox svg{ width:12px; height:12px; stroke:#fff; fill:none; stroke-width:3; display:none; }
  .checkbox.checked svg{ display:block; }

  .task-text{ flex:1; font-size:15px; word-break:break-word; }
  .task-item.done .task-text{ text-decoration:line-through; color:var(--ink-muted); }

  .priority-chip{
    font-size:11px; font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:600;
    padding:4px 10px; border-radius:999px; flex:0 0 auto;
  }
  .priority-high{ background:var(--high-tint); color:var(--high); }
  .priority-medium{ background:var(--med-tint); color:var(--med); }
  .priority-low{ background:var(--low-tint); color:var(--low); }

  .del-btn{
    border:none; background:transparent; color:var(--ink-muted); cursor:pointer;
    padding:4px; border-radius:6px; flex:0 0 auto; display:flex;
  }
  .del-btn:hover{ color:var(--high); background:var(--high-tint); }
  .del-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }

  .empty-state{ text-align:center; padding:36px 10px; color:var(--ink-muted); font-size:14px; }

  footer{ text-align:center; margin-top:26px; font-size:12px; color:var(--ink-muted); overflow-x:auto; }

  @media (max-width:480px){
    header{ flex-direction:column; align-items:flex-start; }
    .week-ring{ align-self:stretch; justify-content:space-between; }
    .week-nav{ justify-content:center; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
  button:focus-visible, input:focus-visible, select:focus-visible, .checkbox:focus-visible, .tab-btn:focus-visible{
    outline:2px solid var(--pine); outline-offset:2px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="login-box" id="login-box">
    <h2>سجّل الدخول لحسابك</h2>
    <p>استخدم نفس الإيميل وكلمة المرور بكل أجهزتك حتى تشوف نفس المهام بالضبط.</p>
    <input type="email" id="login-email" placeholder="الإيميل" autocomplete="username">

    <div class="login-actions">
      <button class="add-btn" id="login-btn">تسجيل الدخول</button>

  <div class="app-shell" id="app-shell" style="display:none;">
  <div class="sync-banner" id="sync-banner">
    <span class="sync-dot"></span>
    <span id="sync-text">جاري الاتصال بالمزامنة…</span>
    <button class="logout-btn" id="logout-btn" title="تسجيل خروج">خروج</button>
  </div>

  <header>
    <div class="title-block">
      <h1>الخطة الأسبوعية</h1>
      <p>نفس المهام على كل أجهزتك — طالما داخل بنفس حسابك</p>
    </div>
    <div class="week-ring" id="week-ring"></div>
  </header>

  <div class="week-nav">
    <div class="nav-arrows">
      <button class="nav-btn" id="prev-week" aria-label="الأسبوع السابق">
        <svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <span class="week-range" id="week-range"></span>
      <button class="nav-btn" id="next-week" aria-label="الأسبوع التالي">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>
    <div class="nav-tools">
      <button class="today-btn" id="today-btn">هذا الأسبوع</button>
      <input type="date" class="date-jump" id="date-jump" aria-label="اذهب لتاريخ محدد" />

  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <span class="panel-progress-text" id="panel-progress-text"></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="panel-bar"></div></div>

    <div class="add-row">
      <input type="text" id="task-input" placeholder="أضف مهمة جديدة…" />
      <select id="priority-select">
        <option value="high">أولوية عالية</option>
        <option value="medium" selected>أولوية متوسطة</option>
        <option value="low">أولوية منخفضة</option>
      </select>
      <button class="add-btn" id="add-btn">إضافة</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
  </div>

  <footer id="save-status">…</footer>
  </div><!-- /app-shell -->
</div>

<script type="module">
(function(){
  const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const PRIORITY_LABEL = {high:'عالية', medium:'متوسطة', low:'منخفضة'};
  const LOCAL_CACHE_KEY = 'weekly-todo-archive-cache';

  let archive = {};        // { "YYYY-MM-DD": [ {id, text, priority, done}, ... ] }
  let viewedWeekStart = getWeekStart(new Date());
  let activeDateKey = dateKey(new Date());
  let docRef = null;
  let synced = false;

  const tabsEl = document.getElementById('tabs');
  const listEl = document.getElementById('task-list');
  const ringEl = document.getElementById('week-ring');
  const panelTitle = document.getElementById('panel-title');
  const panelProgressText = document.getElementById('panel-progress-text');
  const panelBar = document.getElementById('panel-bar');
  const saveStatus = document.getElementById('save-status');
  const syncBanner = document.getElementById('sync-banner');
  const syncText = document.getElementById('sync-text');
  const input = document.getElementById('task-input');
  const prioritySelect = document.getElementById('priority-select');
  const weekRangeEl = document.getElementById('week-range');
  const dateJumpEl = document.getElementById('date-jump');
  const addBtn = document.getElementById('add-btn');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function dateKey(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
  function getWeekStart(d){
    const nd = new Date(d); nd.setHours(0,0,0,0);
    const dow = nd.getDay(); const diff = (dow + 1) % 7;
    return addDays(nd, -diff);
  }
  function weekDates(){ return [0,1,2,3,4,5,6].map(i => addDays(viewedWeekStart, i)); }
  function tasksFor(key){ if(!archive[key]) archive[key] = []; return archive[key]; }
  function dayProgress(key){
    const tasks = archive[key] || [];
    if(!tasks.length) return 0;
    return Math.round((tasks.filter(t => t.done).length / tasks.length) * 100);
  }
  function formatWeekRange(){
    const dates = weekDates(), first = dates[0], last = dates[6];
    if(first.getMonth() === last.getMonth()) return `${first.getDate()} – ${last.getDate()} ${MONTH_NAMES[first.getMonth()]} ${first.getFullYear()}`;
    return `${first.getDate()} ${MONTH_NAMES[first.getMonth()]} – ${last.getDate()} ${MONTH_NAMES[last.getMonth()]} ${last.getFullYear()}`;
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    const todayKey = dateKey(new Date());
    weekDates().forEach(d => {
      const key = dateKey(d);
      const tasks = archive[key] || [];
      const doneCount = tasks.filter(t => t.done).length;
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (key === activeDateKey ? ' active' : '') + (key === todayKey ? ' is-today' : '');
      btn.innerHTML = `${DAY_NAMES[d.getDay()]}<span class="tab-date">${d.getDate()}</span>${tasks.length ? `<span class="tab-count">${doneCount}/${tasks.length}</span>` : ''}`;
      btn.addEventListener('click', () => { activeDateKey = key; renderAll(); });
      tabsEl.appendChild(btn);
    });
  }

  function renderRing(){
    ringEl.innerHTML = '';
    weekDates().forEach(d => {
      const pct = dayProgress(dateKey(d));
      const item = document.createElement('div');
      item.className = 'ring-day';
      item.innerHTML = `<div class="ring-track"><div class="ring-fill" style="height:${pct}%"></div></div><div class="ring-label">${DAY_NAMES[d.getDay()].slice(0,2)}</div>`;
      ringEl.appendChild(item);
    });
  }

  function renderPanel(){
    const [y,m,dd] = activeDateKey.split('-').map(Number);
    const activeDate = new Date(y, m-1, dd);
    panelTitle.textContent = `${DAY_NAMES[activeDate.getDay()]} — ${activeDate.getDate()} ${MONTH_NAMES[activeDate.getMonth()]} ${activeDate.getFullYear()}`;

    const tasks = tasksFor(activeDateKey);
    const pct = dayProgress(activeDateKey);
    panelProgressText.textContent = tasks.length ? `${tasks.filter(t=>t.done).length} من ${tasks.length} منجزة` : 'لا مهام بعد';
    panelBar.style.width = pct + '%';

    listEl.innerHTML = '';
    if(!tasks.length){
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'يوم فاضي — أضف أول مهمة إلك بالأعلى.';
      listEl.appendChild(empty);
      return;
    }
    const order = {high:0, medium:1, low:2};
    [...tasks].sort((a,b) => order[a.priority] - order[b.priority]).forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');

      const box = document.createElement('div');
      box.className = 'checkbox' + (task.done ? ' checked' : '');
      box.setAttribute('role','checkbox'); box.setAttribute('aria-checked', task.done); box.tabIndex = 0;
      box.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12 9 18 20 6"/></svg>';
      box.addEventListener('click', () => toggleTask(task.id));
      box.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleTask(task.id); } });

      const text = document.createElement('span');
      text.className = 'task-text'; text.textContent = task.text;

      const chip = document.createElement('span');
      chip.className = 'priority-chip priority-' + task.priority; chip.textContent = PRIORITY_LABEL[task.priority];

      const del = document.createElement('button');
      del.className = 'del-btn'; del.setAttribute('aria-label','حذف المهمة');
      del.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      del.addEventListener('click', () => deleteTask(task.id));

      li.append(box, text, chip, del);
      listEl.appendChild(li);
    });
  }

  function renderAll(){
    weekRangeEl.textContent = formatWeekRange();
    renderTabs(); renderRing(); renderPanel();
  }

  function toggleTask(id){
    const t = tasksFor(activeDateKey).find(t => t.id === id);
    if(t){ t.done = !t.done; renderAll(); persist(); }
  }
  function deleteTask(id){
    archive[activeDateKey] = tasksFor(activeDateKey).filter(t => t.id !== id);
    renderAll(); persist();
  }
  function addTask(){
    const val = input.value.trim();
    if(!val) return;
    tasksFor(activeDateKey).push({ id: uid(), text: val, priority: prioritySelect.value, done:false });
    input.value = '';
    renderAll(); persist(); input.focus();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });
  document.getElementById('prev-week').addEventListener('click', () => { viewedWeekStart = addDays(viewedWeekStart, -7); activeDateKey = dateKey(viewedWeekStart); renderAll(); });
  document.getElementById('next-week').addEventListener('click', () => { viewedWeekStart = addDays(viewedWeekStart, 7); activeDateKey = dateKey(viewedWeekStart); renderAll(); });
  document.getElementById('today-btn').addEventListener('click', () => { viewedWeekStart = getWeekStart(new Date()); activeDateKey = dateKey(new Date()); renderAll(); });
  dateJumpEl.addEventListener('change', () => {
    if(!dateJumpEl.value) return;
    const [yy,mm,ddv] = dateJumpEl.value.split('-').map(Number);
    const picked = new Date(yy, mm-1, ddv);
    viewedWeekStart = getWeekStart(picked); activeDateKey = dateKey(picked);
    renderAll();
  });

  // ---------- Sync layer (Firebase Auth + Firestore — your own free account) ----------
  let writeChain = Promise.resolve();
  let saveTimer = null;
  let unsubDoc = null;

  function cacheLocally(){
    try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(archive)); }catch(e){}
  }
  function loadLocalCache(){
    try{
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if(raw){ const parsed = JSON.parse(raw); if(parsed && typeof parsed === 'object') archive = parsed; }
    }catch(e){}
  }

  function persist(){
    cacheLocally();
    saveStatus.textContent = 'جاري الحفظ…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      writeChain = writeChain.then(async () => {
        if(!docRef){ saveStatus.textContent = 'محفوظ على هذا الجهاز فقط (سجّل الدخول للمزامنة)'; return; }
        try{
          await window.fb.setDoc(docRef, { days: archive });
          saveStatus.textContent = 'تمت المزامنة على كل أجهزتك ✓';
        }catch(err){
          console.error('firestore write error', err);
          saveStatus.textContent = 'تعذر رفع آخر تغيير — تحقق من الاتصال';
        }
      });
    }, 350);
  }

  function setBannerOk(msg){ syncBanner.classList.remove('warn'); syncText.textContent = msg; }
  function setBannerWarn(msg){ syncBanner.classList.add('warn'); syncText.textContent = msg; }

  function showApp(){ document.getElementById('login-box').style.display = 'none'; document.getElementById('app-shell').style.display = ''; }
  function showLogin(){ document.getElementById('login-box').style.display = ''; document.getElementById('app-shell').style.display = 'none'; }

  function attachUserDoc(uid){
    docRef = window.fb.doc(window.fb.db, 'users', uid, 'data', 'archive');
    if(unsubDoc) unsubDoc();
    unsubDoc = window.fb.onSnapshot(docRef,
      snap => {
        if(snap.exists()){
          const body = snap.data();
          if(body && typeof body.days === 'object'){ archive = body.days; cacheLocally(); renderAll(); }
        }
        setBannerOk('متزامن ✓ — نفس مهامك على كل أجهزتك المسجّلة بنفس الحساب');
      },
      err => { console.error('onSnapshot error', err); setBannerWarn('انقطعت المزامنة — يترفع تلقائيًا لما يرجع الاتصال'); }
    );
  }

  function initFirebaseUI(){
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const emailEl = document.getElementById('login-email');
    const passEl = document.getElementById('login-password');
    const errEl = document.getElementById('login-error');

    async function handle(action){
      errEl.textContent = '';
      const email = emailEl.value.trim(), pass = passEl.value;
      if(!email || pass.length < 6){ errEl.textContent = 'أدخل إيميل صحيح وكلمة مرور ٦ أحرف فأكثر'; return; }
      try{
        if(action === 'signup') await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, pass);
        else await window.fb.signInWithEmailAndPassword(window.fb.auth, email, pass);
      }catch(err){
        const map = { 'auth/email-already-in-use':'هذا الإيميل مسجّل مسبقًا — اضغط تسجيل الدخول', 'auth/invalid-email':'الإيميل غير صحيح', 'auth/wrong-password':'كلمة المرور غلط', 'auth/user-not-found':'ما فيه حساب بهذا الإيميل — اضغط إنشاء حساب', 'auth/invalid-credential':'بيانات الدخول غير صحيحة' };
        errEl.textContent = map[err.code] || ('صار خطأ: ' + err.code);
      }
    }
    loginBtn.addEventListener('click', () => handle('login'));
    signupBtn.addEventListener('click', () => handle('signup'));
    logoutBtn.addEventListener('click', () => window.fb.signOut(window.fb.auth));

    window.fb.onAuthStateChanged(window.fb.auth, user => {
      if(unsubDoc){ unsubDoc(); unsubDoc = null; }
      docRef = null;
      if(user){ showApp(); attachUserDoc(user.uid); }
      else{ showLogin(); setBannerWarn('غير مسجّل دخول'); }
    });
  }

  loadLocalCache();
  renderAll();
  initFirebaseUI();
})();
</script>
</body>
</html>
